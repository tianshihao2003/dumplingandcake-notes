<text font-size="36" fill="#000000" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="-333.8" y="-286.47">复杂度分析</tspan></text>
<text font-size="28" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="109.94" y="-380.6">算法效率评估</tspan></text>
<text font-size="20" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="333.94" y="-562.6">目标</tspan></text>
<text font-size="16" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="521.94" y="-577.6">找到问题解法</tspan></text>
<text font-size="16" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="521.94" y="-547.6">寻求最优解法</tspan></text>
<text font-size="20" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="353.94" y="-487.6">两个维度</tspan></text>
<text font-size="16" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="545.94" y="-502.6">时间效率</tspan></text>
<text font-size="16" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="545.94" y="-472.6">空间效率</tspan></text>
<text font-size="20" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="333.94" y="-305.6">方法</tspan></text>
<text font-size="16" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="505.94" y="-419.1">实际测试</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="735.94" y="-430.1">难以排除测试环境的干扰因素</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="729.94" y="-408.1">展开完整测试非常耗费资源</tspan></text>
<text font-size="16" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="505.94" y="-274.6">理论估算</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="750.98" y="-368.1">复杂度分析(又叫: 渐近复杂度分析)</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="759.94" y="-346.1">它描述了随着输入数据规模的增加，</tspan><tspan x="759.94" y="-331.1">算法执行所需时间和空间的增长趋势。</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="669.94" y="-298.1">分类</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="831.94" y="-309.1">时间复杂度</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="831.94" y="-287.1">空间复杂度</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="729.94" y="-247.1">克服了实际测试方法的弊端</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="669.94" y="-203.1">优点</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="813.94" y="-225.1">独立</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="825.94" y="-203.1">绿色节能</tspan></text>
<text font-size="12" fill="#AF1818" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="885.94" y="-181.1">能体现不同数据量下的算法效率</tspan></text>
<text font-size="28" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="74.77" y="-59.9">迭代与递归</tspan></text>
<text font-size="20" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="284.77" y="-101.9">迭代</tspan></text>
<text font-size="16" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="452.84" y="-131.9">for循环</tspan></text>
<text font-size="16" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="462.1" y="-101.9">while 循环</tspan></text>
<text font-size="16" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="456.77" y="-71.9">嵌套循环</tspan></text>
<text font-size="20" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="284.77" y="-7.4">递归</tspan></text>
<text font-size="16" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="448.77" y="-7.4">三要素</tspan></text>
<text font-size="12" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="708.84" y="-29.4">终止条件: 用于决定什么时候由“递”转“归”。</tspan></text>
<text font-size="12" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="775.8" y="-7.4">递归调用: 对应“递”，函数调用自身，通常输入更小或更简化的参数。</tspan></text>
<text font-size="12" fill="#075F50" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="751.8" y="14.6">递归结果: 对应“归”，将当前递归层级的结果返回至上一层。</tspan></text>
<text font-size="28" fill="#3E18AF" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan x="-756.51" y="-496.27">时间复杂度</tspan></text>
